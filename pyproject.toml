[project]
name = "django-oscar-availfiles"
version = "0.2.0"
description = "Wires django-availfiles into django-oscar: a dashboard section to upload/browse files, plus a TinyMCE file-picker so editors can link to them from any wysiwyg field."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Diego Cebrian", email = "diego@cebrian-it.fr" }]
keywords = ["django", "django-oscar", "files", "media-library", "tinymce"]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: BSD License",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "django>=5.2,<5.3",
    "django-oscar>=4.2,<4.3",
    "django-availfiles>=0.2.0,<0.3",
]

[project.urls]
Homepage = "https://github.com/hisie/django-oscar-availfiles"
Repository = "https://github.com/hisie/django-oscar-availfiles"
Issues = "https://github.com/hisie/django-oscar-availfiles/issues"

[dependency-groups]
dev = [
    "black",
    "coverage",
    "isort",
    "mypy",
    "pytest",
    "pytest-django",
    "django-stubs",
]

[tool.uv.sources]
# Not published yet — see django-availfiles's own repo.
django-availfiles = { path = "../django-availfiles", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oscar_availfiles"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main"]
mypy_path = "src"

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src/oscar_availfiles"]
